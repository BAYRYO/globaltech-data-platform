# Configuration shared by every environment.
#
# Each key can be overridden, last wins:
#   1. this file
#   2. conf/env/<env>.toml, where <env> is the --env given to run.py (local or cluster)
#   3. an environment variable GTDP_<SECTION>__<KEY>, for example GTDP_SPARK__SHUFFLE_PARTITIONS=64
#   4. run.py --set <section>.<key>=<value>, for example --set spark.adaptive=false
#
# An unknown section or key, or a value of the wrong type, stops the job before Spark starts.
# No secret goes in these files: the pseudonymization salt comes only from GTDP_PSEUDO_SALT.

[app]
# Prefix of the Spark application name shown in YARN and the Spark History Server.
name = "gtdp"
# Spark session time zone. Timestamps are computed and stored in UTC.
timezone = "UTC"

[spark]
# Partitions after a shuffle (joins, aggregations). Adaptive query execution merges small ones.
shuffle_partitions = 8
# Adaptive query execution: re-plans joins and shuffle partitions from runtime statistics.
adaptive = true

# [paths] has no common value: each environment sets its own in conf/env/<env>.toml.

[streaming]
# Sensor stream job streaming-sensors and its housekeeping (ADR-0008, docs/runbook/streaming.md).
# Seconds between two micro-batches; 0 starts the next one as soon as the previous one ends. Each
# micro-batch adds files, partitions and event log entries: 30 s reads 6 files of 5 s each.
trigger_interval_s = 30
# Most new files read by one micro-batch: one minute of stream (one file per 5 s). Keep it at 18
# or less, otherwise an event 5 minutes late can pass the 2-minute watermark after a restart.
max_files_per_trigger = 12
# Partitions of the state (deduplication, open windows). Fixed by the checkpoint at its creation.
state_partitions = 4
# Stop the job, with a SUCCESS audit row, after this many triggers in a row without new data and
# without a batch to run. 0 runs until stopped (stop marker, see the runbook).
stop_after_idle_triggers = 0
# An event whose event_time is more than this many seconds after its emitted_at is rejected
# (FUTURE_EVENT): it would move the watermark ahead and drop the rest of the stream as late.
future_tolerance_s = 60
# Age in seconds from which a lock or a staging directory of a streaming table counts as left by
# a run that died: a restarted job waits up to this long for the lock of its previous run. Keep
# it above the longest housekeeping step (spark.gtdp.io.staleAfterSeconds of both jobs).
stale_after_s = 300
# streaming-housekeeping moves each input file to <paths.streaming>/archive/sensors once every
# query committed it, under the UTC day it arrived, and deletes the days older than this many
# days before the current one: 2 keeps today and the two days before. 0 keeps today only.
archive_retention_days = 2

[streaming.thresholds]
# Alert limits per metric (docs/data-contract.md#capteurs): an event alerts when its value is
# greater than "above" or lower than "below".
temperature = { above = 85.0 }
vibration = { above = 7.1 }
pressure = { below = 4.0, above = 8.0 }

[gold]
# Products kept per country in kpi_top_products_country, by dense rank of revenue: products tied
# at a rank share it, so a country can list more than top_n products (docs/runbook/gold.md).
top_n = 5
