# Spark built without Hadoop logs through Hadoop's slf4j 1.7 and the log4j 1 bridge into log4j 2.
# Without this file log4j 2 stays unconfigured and drops everything below ERROR.
rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n%ex

# Application id, YARN state and tracking URL of each submission.
logger.yarn.name = org.apache.spark.deploy.yarn.Client
logger.yarn.level = info
