# Cluster-wide Spark defaults. A job overrides them with --conf (see docs/platform.md).
spark.master                                   yarn
spark.submit.deployMode                        client

# Sized for 2 NodeManagers of 2560 MB: each executor takes 1 GB + 384 MB overhead.
spark.driver.memory                            1g
spark.yarn.am.memory                           512m
spark.executor.memory                          1g
spark.executor.cores                           2
spark.executor.instances                       2

# Spark jars uploaded once by scripts/cluster/init-hdfs.sh, cached by every NodeManager.
spark.yarn.archive                             hdfs://namenode:8020/apps/spark/spark-jars-3.5.3.zip

spark.pyspark.python                           /usr/local/bin/python3.11

# Hadoop native codecs and checksums.
spark.driver.extraLibraryPath                  /opt/hadoop/lib/native
spark.executor.extraLibraryPath                /opt/hadoop/lib/native
spark.yarn.am.extraLibraryPath                 /opt/hadoop/lib/native

spark.eventLog.enabled                         true
spark.eventLog.dir                             hdfs://namenode:8020/spark-logs
spark.history.fs.logDirectory                  hdfs://namenode:8020/spark-logs
spark.history.fs.cleaner.enabled               true
spark.history.fs.cleaner.maxAge                7d
spark.yarn.historyServer.address               http://localhost:18080

# Cluster mode passes GTDP_PSEUDO_SALT as spark.yarn.appMasterEnv.*: keep it out of UIs and event logs.
spark.redaction.regex                          (?i)secret|password|token|access[.]key|salt

spark.sql.adaptive.enabled                     true
spark.sql.adaptive.coalescePartitions.enabled  true
spark.sql.adaptive.skewJoin.enabled            true
