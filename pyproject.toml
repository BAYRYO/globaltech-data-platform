[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtdp"
version = "0.1.0"
description = "GlobalTech Data Platform: HDFS/YARN data lake with Spark batch and streaming pipelines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
spark = ["pyspark==3.5.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: tests that start Spark or process larger generated data",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004"]

[tool.coverage.run]
source = ["gtdp"]
branch = true

[tool.coverage.paths]
# The tests that run a job from a dist/gtdp.zip copy measure the modules of src/gtdp.
source = ["src/gtdp", "*/dist/gtdp.zip/gtdp"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
skip_empty = true
